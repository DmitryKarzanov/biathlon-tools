<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>Отслеживание лидеров — tool_for_biathlon</title>

    <style>
        :root {
            --blue: #4A8BF0;
            --blue-solid: #174A99;
            --blue-hover: #1a5cb5;
            --red: #E14A2E;
            --green: #22c55e;
            --gray: #E3E3E3;
            --text: #14181F;
            --muted: #6B7280;
            --radius: 14px;
            --container: 720px;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            position: relative;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            color: #fff;
            background-color: #000;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: calc(20px + var(--safe-bottom));
        }

        body::before {
            content: "";
            position: fixed; inset: 0; z-index: -2;
            background-color: #000;
            background-image: url('https://i.pinimg.com/1200x/6c/29/98/6c2998bd3d41c11cb3e066937b584c81.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            filter: grayscale(100%) contrast(1.05) brightness(.65);
        }

        body::after {
            content: "";
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0,0,0,.35), transparent 60%),
                linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.82) 100%);
            pointer-events: none;
        }

        img, svg { display: block; max-width: 100%; }
        a { color: inherit; }

        .container {
            width: 100%;
            max-width: var(--container);
            margin: 0 auto;
            padding: 0 12px;
        }

        /* ============================================================
           ЛИПКАЯ ШАПКА
           ============================================================ */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,.12);
            padding-top: var(--safe-top);
        }

        .sticky-header__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
        }

        .sticky-header__title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .sticky-header__clock {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .5);
            border: 1px solid rgba(255,255,255,.14);
            font-size: 15px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .sticky-header__clock::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 0 0 rgba(225, 74, 46, .6);
            animation: pulse 1.9s infinite;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(225, 74, 46, .55); }
            70%  { box-shadow: 0 0 0 9px rgba(225, 74, 46, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 74, 46, 0); }
        }

        /* ============================================================
           ОСНОВНОЙ БЛОК
           ============================================================ */
        .main { padding: 14px 0 30px; }

        .panel {
            background: rgba(10, 10, 10, .78);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: var(--radius);
            padding: 18px 16px;
            margin-bottom: 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .panel__title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: rgba(255,255,255,.55);
            margin-bottom: 14px;
        }

        .setup-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field__label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
            color: rgba(255,255,255,.55);
        }

        .field__hint {
            font-size: 12px;
            color: rgba(255,255,255,.45);
            margin-top: 2px;
        }

        .input,
        .select {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,.2);
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .input:focus,
        .select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(74, 139, 240, .22);
        }

        .select {
            background-image:
                linear-gradient(45deg, transparent 50%, #fff 50%),
                linear-gradient(135deg, #fff 50%, transparent 50%);
            background-position:
                calc(100% - 18px) calc(50% - 2px),
                calc(100% - 13px) calc(50% - 2px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 36px;
            cursor: pointer;
        }

        .select option { background: #1a1a1a; color: #fff; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: .01em;
            cursor: pointer;
            text-decoration: none;
            transition: background-color .18s ease, transform .12s ease,
                        box-shadow .18s ease, opacity .18s ease;
            user-select: none;
        }

        .btn:active { transform: scale(.98); }

        .btn--primary {
            background: var(--blue-solid);
            color: #fff;
        }

        .btn--primary:hover:not(:disabled) {
            background: var(--blue-hover);
            box-shadow: 0 8px 20px rgba(23, 74, 153, .4);
        }

        .btn--primary:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn--ghost {
            background: transparent;
            border: 1.5px solid rgba(255,255,255,.3);
            color: #fff;
        }

        .btn--ghost:hover { border-color: rgba(255,255,255,.6); }

        .btn--full { width: 100%; }

        .race-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
        }

        .race-item {
            display: inline-flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
        }

        .race-item__label {
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: rgba(255,255,255,.5);
            font-size: 10px;
        }

        .race-item__value {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .race-bar .btn {
            margin-left: auto;
            min-height: 38px;
            padding: 8px 14px;
            font-size: 13px;
        }

        .add-athlete {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .add-athlete .input {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            letter-spacing: .05em;
            min-height: 52px;
        }

        .add-athlete .btn {
            flex: 0 0 auto;
            min-height: 52px;
            padding: 0 22px;
        }

        /* ============================================================
           КАРТОЧКА СПОРТСМЕНА
           ============================================================ */
        .athletes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            padding: 30px 16px;
            text-align: center;
            border: 1px dashed rgba(255,255,255,.18);
            border-radius: var(--radius);
            color: rgba(255,255,255,.55);
            font-size: 14px;
            line-height: 1.5;
        }

        .athlete-card {
            background: rgba(10, 10, 10, .82);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: var(--radius);
            padding: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .athlete-card__head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .athlete-card__number {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--blue);
            line-height: 1;
        }

        .athlete-card__start {
            font-size: 12px;
            color: rgba(255,255,255,.6);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }

        .athlete-card__start strong {
            display: block;
            font-size: 14px;
            color: #fff;
            font-weight: 700;
        }

        .athlete-card__actions {
            margin-left: auto;
            display: inline-flex;
            gap: 6px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.05);
            color: rgba(255,255,255,.85);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            font-family: inherit;
            transition: background-color .15s ease, color .15s ease,
                        border-color .15s ease, transform .1s ease;
            user-select: none;
        }

        .icon-btn:active { transform: scale(.94); }

        .icon-btn:hover {
            background: rgba(255,255,255,.12);
            border-color: rgba(255,255,255,.4);
            color: #fff;
        }

        .icon-btn--danger:hover {
            background: rgba(225, 74, 46, .25);
            border-color: var(--red);
            color: #fff;
        }

        /* ---------- КНОПКИ КРУГОВ ---------- */
        .lap-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }

        .lap-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 56px;
            padding: 8px 4px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,.22);
            background: rgba(0, 0, 0, .35);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color .15s ease, border-color .15s ease,
                        transform .1s ease, opacity .2s ease;
            user-select: none;
        }

        .lap-btn__sub {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
        }

        .lap-btn:active { transform: scale(.96); }

        .lap-btn:not(:disabled):hover {
            background: var(--blue-solid);
            border-color: var(--blue-solid);
        }

        .lap-btn.is-done {
            background: rgba(34, 197, 94, .12);
            border-color: rgba(34, 197, 94, .5);
            color: #bbf7d0;
        }

        /* ---------- КНОПКА БЫСТРОЙ ОТСЕЧКИ ---------- */
        .quick-split {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 14px;
            border-radius: 11px;
            border: 1.5px dashed rgba(74, 139, 240, .5);
            background: rgba(74, 139, 240, .08);
            color: #b6d4ff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .15s ease, border-color .15s ease;
            user-select: none;
            width: 100%;
            margin-bottom: 10px;
        }

        .quick-split:hover {
            background: rgba(74, 139, 240, .18);
            border-color: var(--blue);
            color: #fff;
        }

        .quick-split:active { transform: scale(.99); }

        /* ---------- СПИСОК ОТСЕЧЕК ---------- */
        .splits-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .split-row {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(255,255,255,.08);
            cursor: pointer;
            transition: background-color .15s ease, border-color .15s ease,
                        transform .1s ease;
            user-select: none;
        }

        .split-row:hover {
            background: rgba(74, 139, 240, .1);
            border-color: rgba(74, 139, 240, .4);
        }

        .split-row:active { transform: scale(.99); }

        .split-row__lap {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(74, 139, 240, .18);
            color: var(--blue);
            font-size: 16px;
            font-weight: 800;
        }

        .split-row__main {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }

        .split-row__time {
            font-size: 20px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
            color: #fff;
            line-height: 1.1;
        }

        .split-row__sub {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
        }

        /* ---------- ОТСТАВАНИЕ ОТ ЛИДЕРА НА КРУГЕ ---------- */
        .split-row__gap {
            flex: 0 0 auto;
            display: inline-flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1px;
            padding: 6px 10px;
            border-radius: 9px;
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            font-size: 15px;
            line-height: 1.1;
            text-align: right;
            min-width: 64px;
            transition: background-color .2s ease, color .2s ease;
        }

        .split-row__gap small {
            display: block;
            font-size: 9px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: rgba(255,255,255,.5);
        }

        .split-row__gap.is-leading {
            background: rgba(34, 197, 94, .16);
            color: #86efac;
            box-shadow: inset 0 0 0 1px rgba(34, 197, 94, .4);
        }

        .split-row__gap.is-leading small {
            color: rgba(134, 239, 172, .7);
        }

        .split-row__gap.is-losing {
            background: rgba(225, 74, 46, .14);
            color: #ff8b73;
            box-shadow: inset 0 0 0 1px rgba(225, 74, 46, .35);
        }

        .split-row__gap.is-losing small {
            color: rgba(255, 139, 115, .65);
        }

        .split-row__actions {
            display: inline-flex;
            gap: 4px;
            flex: 0 0 auto;
        }

        .split-row__actions .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 15px;
        }

        /* ============================================================
           МОДАЛКА
           ============================================================ */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
        }

        .modal.is-open { display: flex; }

        .modal__overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: fadeIn .2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .modal__content {
            position: relative;
            width: 100%;
            max-width: 520px;
            max-height: 92vh;
            overflow-y: auto;
            background: #0e0e0e;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            border: 1px solid rgba(255,255,255,.12);
            border-bottom: none;
            box-shadow: 0 -20px 40px rgba(0, 0, 0, .5);
            padding: 18px 16px calc(18px + var(--safe-bottom));
            animation: slideUp .25s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        @media (min-width: 640px) {
            .modal { align-items: center; padding: 20px; }
            .modal__content {
                border-radius: 22px;
                border-bottom: 1px solid rgba(255,255,255,.12);
                padding: 22px;
            }
        }

        .modal__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }

        .modal__title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .modal__title span { color: var(--blue); }

        .modal__close {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .modal__close:hover {
            background: rgba(255,255,255,.12);
        }

        .modal__section {
            margin-bottom: 18px;
        }

        .modal__label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(255,255,255,.5);
            margin-bottom: 8px;
        }

        .modal__hint {
            font-size: 12px;
            color: rgba(255,255,255,.55);
            margin-top: 8px;
            line-height: 1.4;
        }

        .modal__hint b { color: #b6d4ff; }

        .lap-picker {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(52px, 1fr));
            gap: 8px;
        }

        .lap-pick {
            min-height: 52px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,.2);
            background: rgba(0, 0, 0, .4);
            color: #fff;
            font-family: inherit;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all .15s ease;
        }

        .lap-pick:active { transform: scale(.95); }

        .lap-pick.is-selected {
            background: var(--blue-solid);
            border-color: var(--blue-solid);
            box-shadow: 0 0 0 3px rgba(74, 139, 240, .25);
        }

        .time-input {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            padding: 16px 12px 12px;
            border-radius: 14px;
            background: rgba(0, 0, 0, .5);
            border: 1.5px solid rgba(255,255,255,.15);
        }

        .time-input__group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .time-input__group label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
        }

        .time-input input {
            width: 70px;
            height: 62px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.04);
            color: #fff;
            font-family: inherit;
            font-size: 26px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
            appearance: textfield;
            padding: 0 4px;
            transition: border-color .15s ease, background-color .15s ease;
        }

        .time-input input::-webkit-outer-spin-button,
        .time-input input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .time-input input:focus {
            border-color: var(--blue);
            background: rgba(74, 139, 240, .1);
        }

        .time-input__sep {
            font-size: 28px;
            font-weight: 800;
            color: rgba(255,255,255,.5);
            user-select: none;
            padding-bottom: 12px;
        }

        .time-input__sep--dot {
            padding-bottom: 14px;
        }

        .time-input__tenth input {
            width: 56px;
        }

        .time-actions {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 12px;
        }

        .time-btn {
            min-height: 44px;
            padding: 6px 4px;
            border-radius: 10px;
            border: 1.5px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.04);
            color: #fff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all .15s ease;
            user-select: none;
        }

        .time-btn:hover {
            background: rgba(74, 139, 240, .15);
            border-color: rgba(74, 139, 240, .5);
        }

        .time-btn:active { transform: scale(.94); }

        .time-btn--now {
            background: rgba(74, 139, 240, .15);
            border-color: rgba(74, 139, 240, .5);
            color: #b6d4ff;
        }

        .modal__warn {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(225, 74, 46, .12);
            border: 1px solid rgba(225, 74, 46, .35);
            font-size: 12px;
            line-height: 1.45;
            color: #ffc4b5;
            margin-bottom: 12px;
        }

        .modal__warn[hidden] { display: none; }

        .modal__actions {
            display: flex;
            gap: 10px;
            padding-top: 4px;
        }

        .modal__actions .btn {
            flex: 1;
            min-height: 52px;
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (min-width: 480px) {
            .container { padding: 0 16px; }
            .panel { padding: 20px 18px; }
            .athlete-card { padding: 16px; }
        }

        @media (max-width: 420px) {
            .split-row {
                grid-template-columns: auto 1fr auto;
                gap: 8px;
                padding: 10px;
            }
            .split-row__gap {
                grid-column: 2 / 4;
                grid-row: 2;
                justify-self: start;
                flex-direction: row;
                align-items: center;
                gap: 6px;
                padding: 4px 10px;
                min-width: 0;
                margin-top: -6px;
            }
            .split-row__gap small {
                display: inline;
                margin-left: 2px;
            }
            .split-row__actions {
                grid-column: 3;
                grid-row: 1;
            }
        }

        @media (max-width: 380px) {
            .time-input input { width: 60px; font-size: 22px; }
            .time-input__tenth input { width: 48px; }
            .time-btn { font-size: 12px; }
        }
    </style>
</head>

<body>

<header class="sticky-header">
    <div class="container sticky-header__inner">
        <div class="sticky-header__title">
            Отслеживание лидеров
        </div>
        <div class="sticky-header__clock" id="clock">--:--:--</div>
    </div>
</header>

<main class="main">
    <div class="container">

        <!-- ============ ЭКРАН НАСТРОЙКИ ============ -->
        <section class="panel" id="setupPanel">
            <h2 class="panel__title">Настройки гонки</h2>

            <div class="setup-form">
                <div class="field">
                    <label class="field__label" for="firstStart">Старт первого участника</label>
                    <input class="input" type="time" id="firstStart" step="1" value="11:00:00">
                </div>

                <div class="field">
                    <label class="field__label" for="raceType">Тип гонки</label>
                    <select class="select" id="raceType">
                        <option value="individual">Индивидуальная (5 кругов)</option>
                        <option value="sprint">Спринт (3 круга)</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label class="field__label" for="interval">Интервал старта, сек</label>
                        <input class="input" type="number" id="interval"
                               min="0" max="600" step="5" value="30"
                               inputmode="numeric">
                    </div>
                    <div class="field">
                        <label class="field__label" for="lapTime">Время круга, мин:сек</label>
                        <input class="input" type="text" id="lapTime"
                               placeholder="8:00" value=""
                               inputmode="numeric">
                    </div>
                </div>
                <div class="field__hint">
                    Время круга — необязательно. Если указать, программа точнее определит круг.
                </div>

                <button class="btn btn--primary btn--full" id="startBtn" type="button">
                    Начать гонку
                </button>
            </div>
        </section>

        <!-- ============ ЭКРАН ТРЕКЕРА ============ -->
        <section id="trackerPanel" hidden>

            <div class="panel">
                <div class="race-bar">
                    <div class="race-item">
                        <span class="race-item__label">Старт #1</span>
                        <span class="race-item__value" id="infoStart">—</span>
                    </div>
                    <div class="race-item">
                        <span class="race-item__label">Гонка</span>
                        <span class="race-item__value" id="infoType">—</span>
                    </div>
                    <div class="race-item">
                        <span class="race-item__label">Интервал</span>
                        <span class="race-item__value" id="infoInterval">—</span>
                    </div>
                    <div class="race-item">
                        <span class="race-item__label">Круг</span>
                        <span class="race-item__value" id="infoLapTime">—</span>
                    </div>
                    <button class="btn btn--ghost" id="changeSetupBtn" type="button">
                        Изменить
                    </button>
                </div>
            </div>

            <div class="panel">
                <h2 class="panel__title">Добавить спортсмена</h2>
                <div class="add-athlete">
                    <input class="input" type="number" id="athleteNumber"
                           min="1" max="999" step="1" inputmode="numeric"
                           placeholder="Номер">
                    <button class="btn btn--primary" id="addAthleteBtn" type="button">
                        Следить
                    </button>
                </div>
            </div>

            <div class="athletes-list" id="athletesList"></div>

        </section>

    </div>
</main>

<!-- ======================= МОДАЛКА ======================= -->
<div class="modal" id="splitModal" role="dialog" aria-modal="true">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content">

        <div class="modal__head">
            <h3 class="modal__title">
                <span id="modalAction">Новая отсечка</span>
                <span id="modalAthleteNumber">#—</span>
            </h3>
            <button class="modal__close" type="button" data-close aria-label="Закрыть">✕</button>
        </div>

        <div class="modal__section">
            <span class="modal__label">Круг</span>
            <div class="lap-picker" id="lapPicker"></div>
            <div class="modal__hint" id="lapHint"></div>
        </div>

        <div class="modal__section">
            <span class="modal__label">Время от старта</span>

            <div class="time-input">
                <div class="time-input__group">
                    <input type="number" id="timeMin" min="0" max="99" value="0"
                           inputmode="numeric">
                    <label for="timeMin">мин</label>
                </div>
                <span class="time-input__sep">:</span>
                <div class="time-input__group">
                    <input type="number" id="timeSec" min="0" max="59" value="0"
                           inputmode="numeric">
                    <label for="timeSec">сек</label>
                </div>
                <span class="time-input__sep time-input__sep--dot">.</span>
                <div class="time-input__group time-input__tenth">
                    <input type="number" id="timeTenth" min="0" max="9" value="0"
                           inputmode="numeric">
                    <label for="timeTenth">доли</label>
                </div>
            </div>

            <div class="time-actions">
                <button class="time-btn" type="button" data-time="-1000">−1с</button>
                <button class="time-btn" type="button" data-time="-100">−0.1</button>
                <button class="time-btn time-btn--now" type="button" data-time="now">Сейчас</button>
                <button class="time-btn" type="button" data-time="100">+0.1</button>
                <button class="time-btn" type="button" data-time="1000">+1с</button>
            </div>
        </div>

        <div class="modal__warn" id="modalWarn" hidden></div>

        <div class="modal__actions">
            <button class="btn btn--ghost" type="button" data-close>Отмена</button>
            <button class="btn btn--primary" type="button" id="saveSplitBtn">Сохранить</button>
        </div>

    </div>
</div>

<script>
/* ============================================================
   КОНСТАНТЫ
   ============================================================ */
const STORAGE_KEY = 'biathlon_leaders_v2';

const RACE_CONFIG = {
    individual: { label: 'Индивидуальная (5 кругов)', short: 'Индивидуальная', laps: 5 },
    sprint:     { label: 'Спринт (3 круга)',         short: 'Спринт',         laps: 3 },
};

const DEFAULT_STATE = {
    version: 2,
    started: false,
    firstStartTimeStr: '11:00:00',
    firstStartTimeMs: null,
    raceType: 'individual',
    intervalSec: 30,
    lapTimeSec: 0,
    athletes: [],
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function pad(n) { return String(n).padStart(2, '0'); }

function formatClock(ms) {
    const d = new Date(ms);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

/** ms -> "MM:SS.d" или "H:MM:SS.d" */
function formatDuration(ms) {
    if (ms == null || isNaN(ms)) return '—';
    if (ms < 0) ms = 0;
    const totalSec = ms / 1000;
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = Math.floor(totalSec % 60);
    const tenth = Math.floor((totalSec * 10) % 10);
    return h > 0
        ? `${h}:${pad(m)}:${pad(s)}.${tenth}`
        : `${pad(m)}:${pad(s)}.${tenth}`;
}

/** Компактный формат для отставания: "+1.2" или "+1:23.4" */
function formatGap(ms) {
    if (ms == null || isNaN(ms) || ms < 0) return '';
    if (ms === 0) return '';
    if (ms < 60000) {
        const totalSec = ms / 1000;
        const s = Math.floor(totalSec);
        const tenth = Math.floor((ms % 1000) / 100);
        return `+${s}.${tenth}`;
    }
    return '+' + formatDuration(ms);
}

function parseDuration(str) {
    if (str == null) return 0;
    str = String(str).trim().replace(',', '.');
    if (!str) return 0;
    if (str.includes(':')) {
        const parts = str.split(':').map(Number);
        let h = 0, m = 0, s = 0;
        if (parts.length === 3) [h, m, s] = parts;
        else                    [m, s] = parts;
        return Math.round((h * 3600 + m * 60 + s) * 1000);
    }
    return Math.round(parseFloat(str) * 1000);
}

function parseStartTime(timeStr) {
    if (!timeStr) return null;
    const [h, m, s = 0] = timeStr.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    const d = new Date();
    d.setHours(h, m, Math.floor(s), 0);
    return d.getTime();
}

/* ============================================================
   СОХРАНЕНИЕ
   ============================================================ */
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.warn('Не удалось сохранить:', e);
    }
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.version !== 2) return;
        state = { ...DEFAULT_STATE, ...parsed };
        if (!Array.isArray(state.athletes)) state.athletes = [];
        state.athletes.forEach(a => {
            if (!Array.isArray(a.splits)) a.splits = [];
            a.splits.sort((x, y) => x.lap - y.lap);
        });
    } catch (e) {
        console.warn('Не удалось загрузить:', e);
    }
}

/* ============================================================
   ОПРЕДЕЛЕНИЕ КРУГА
   ============================================================ */
function detectLap(athlete, splitTimeMs, lapTimeSec, maxLaps) {
    const elapsedSec = (splitTimeMs - athlete.startTimeMs) / 1000;
    const usedLaps = new Set(athlete.splits.map(s => s.lap));

    let guess;
    if (lapTimeSec > 0 && elapsedSec > 0) {
        guess = Math.round(elapsedSec / lapTimeSec);
        guess = Math.max(1, Math.min(maxLaps, guess));
    } else {
        const maxUsed = athlete.splits.length
            ? Math.max(...athlete.splits.map(s => s.lap))
            : 0;
        guess = Math.min(maxLaps, maxUsed + 1);
    }

    if (usedLaps.has(guess)) {
        for (let l = guess + 1; l <= maxLaps; l++) {
            if (!usedLaps.has(l)) { guess = l; break; }
        }
    }

    return guess;
}

/* ============================================================
   ЛИДЕР НА КАЖДОМ КРУГЕ
   ============================================================ */
/**
 * Возвращает объект { lapNumber: { timeMs, athleteNumber } },
 * где timeMs — минимальное время от старта на этом круге
 * среди всех отслеживаемых спортсменов.
 */
function computeLapLeaders() {
    const leaders = {};
    state.athletes.forEach(athlete => {
        athlete.splits.forEach(split => {
            const fromStart = split.timeMs - athlete.startTimeMs;
            const cur = leaders[split.lap];
            if (!cur || fromStart < cur.timeMs) {
                leaders[split.lap] = {
                    timeMs: fromStart,
                    athleteNumber: athlete.number,
                };
            }
        });
    });
    return leaders;
}

/* ============================================================
   ДЕЙСТВИЯ С ГОНКОЙ
   ============================================================ */
function startRace() {
    const timeStr = document.getElementById('firstStart').value;
    const raceType = document.getElementById('raceType').value;
    const interval = parseInt(document.getElementById('interval').value, 10);
    const lapTimeStr = document.getElementById('lapTime').value.trim();

    if (!timeStr) { alert('Укажите время старта первого участника'); return; }
    if (isNaN(interval) || interval < 0) { alert('Введите корректный интервал'); return; }

    const firstMs = parseStartTime(timeStr);
    if (firstMs == null) { alert('Некорректный формат времени старта'); return; }

    state.firstStartTimeStr = timeStr;
    state.firstStartTimeMs = firstMs;
    state.raceType = raceType;
    state.intervalSec = interval;
    state.lapTimeSec = lapTimeStr ? Math.round(parseDuration(lapTimeStr) / 1000) : 0;
    state.started = true;

    saveState();
    render();
}

function resetAll() {
    if (!confirm('Сбросить всё: настройки, спортсменов и отсечки?')) return;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    render();
}

function changeSetup() {
    if (!confirm('Вернуться к настройкам? Текущие данные будут удалены.')) return;
    resetAll();
}

function addAthlete(number) {
    if (!state.started) return;
    if (!Number.isInteger(number) || number < 1) {
        alert('Введите корректный номер (целое число ≥ 1)');
        return;
    }
    if (state.athletes.some(a => a.number === number)) {
        alert(`Участник #${number} уже отслеживается`);
        return;
    }

    const startTimeMs = state.firstStartTimeMs + (number - 1) * state.intervalSec * 1000;
    state.athletes.push({ number, startTimeMs, splits: [] });
    state.athletes.sort((a, b) => a.number - b.number);

    saveState();
    render();
}

function removeAthlete(number) {
    const a = state.athletes.find(x => x.number === number);
    if (!a) return;
    if (!confirm(`Убрать участника #${number} со всеми отсечками?`)) return;
    state.athletes = state.athletes.filter(x => x.number !== number);
    saveState();
    render();
}

/* ============================================================
   МОДАЛКА
   ============================================================ */
const modal = {
    el: null,
    isOpen: false,
    mode: 'new',
    athlete: null,
    splitIndex: -1,
    maxLaps: 5,
    selectedLap: 1,
    autoLap: 1,

    init() {
        this.el = document.getElementById('splitModal');

        this.el.querySelectorAll('[data-close]').forEach(el => {
            el.addEventListener('click', () => this.close());
        });

        document.addEventListener('keydown', (e) => {
            if (!this.isOpen) return;
            if (e.key === 'Escape') this.close();
            if (e.key === 'Enter') {
                const tag = (e.target && e.target.tagName) || '';
                if (tag === 'INPUT') e.target.blur();
                this.save();
            }
        });

        document.getElementById('lapPicker').addEventListener('click', (e) => {
            const btn = e.target.closest('.lap-pick');
            if (!btn) return;
            this.selectLap(parseInt(btn.dataset.lap, 10));
        });

        this.el.querySelectorAll('[data-time]').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.dataset.time;
                if (val === 'now') {
                    const now = Date.now();
                    this.setTimeFromMs(now - this.athlete.startTimeMs);
                } else {
                    const delta = parseInt(val, 10);
                    const cur = this.getTimeFromInputs();
                    this.setTimeFromMs(Math.max(0, cur + delta));
                }
            });
        });

        document.getElementById('saveSplitBtn').addEventListener('click', () => this.save());

        ['timeMin', 'timeSec', 'timeTenth'].forEach(id => {
            const input = document.getElementById(id);
            input.addEventListener('focus', () => setTimeout(() => input.select(), 0));
            input.addEventListener('input', () => this.checkConflicts());
            input.addEventListener('blur', () => this.clampInputs());
        });
    },

    clampInputs() {
        const min = document.getElementById('timeMin');
        const sec = document.getElementById('timeSec');
        const tenth = document.getElementById('timeTenth');
        min.value = Math.max(0, Math.min(99, parseInt(min.value, 10) || 0));
        sec.value = Math.max(0, Math.min(59, parseInt(sec.value, 10) || 0));
        tenth.value = Math.max(0, Math.min(9, parseInt(tenth.value, 10) || 0));
    },

    openNew(athlete, forcedLap) {
        this.mode = 'new';
        this.athlete = athlete;
        this.splitIndex = -1;
        this.maxLaps = RACE_CONFIG[state.raceType].laps;

        const now = Date.now();
        const autoLap = detectLap(athlete, now, state.lapTimeSec, this.maxLaps);
        this.autoLap = autoLap;
        this.selectedLap = forcedLap || autoLap;

        this.renderLaps();
        this.setTimeFromMs(now - athlete.startTimeMs);
        this.updateHint();
        this.updateTitle();
        this.show();
    },

    openEdit(athlete, splitIndex) {
        const split = athlete.splits[splitIndex];
        if (!split) return;

        this.mode = 'edit';
        this.athlete = athlete;
        this.splitIndex = splitIndex;
        this.maxLaps = RACE_CONFIG[state.raceType].laps;
        this.autoLap = split.lap;
        this.selectedLap = split.lap;

        this.renderLaps();
        this.setTimeFromMs(split.timeMs - athlete.startTimeMs);
        this.updateHint();
        this.updateTitle();
        this.show();
    },

    renderLaps() {
        const picker = document.getElementById('lapPicker');
        let html = '';
        for (let i = 1; i <= this.maxLaps; i++) {
            const cls = i === this.selectedLap ? 'lap-pick is-selected' : 'lap-pick';
            html += `<button type="button" class="${cls}" data-lap="${i}">${i}</button>`;
        }
        picker.innerHTML = html;
    },

    selectLap(lap) {
        this.selectedLap = lap;
        this.el.querySelectorAll('.lap-pick').forEach(el => {
            el.classList.toggle('is-selected',
                parseInt(el.dataset.lap, 10) === lap);
        });
        this.updateHint();
        this.checkConflicts();
    },

    updateTitle() {
        document.getElementById('modalAction').textContent =
            this.mode === 'new' ? 'Новая отсечка' : 'Изменение отсечки';
        document.getElementById('modalAthleteNumber').textContent =
            '#' + this.athlete.number;
    },

    updateHint() {
        const hint = document.getElementById('lapHint');
        if (this.mode === 'new') {
            if (this.selectedLap === this.autoLap) {
                hint.innerHTML = state.lapTimeSec > 0
                    ? `Автоопределение по времени круга: <b>круг ${this.autoLap}</b>.`
                    : `Автоопределение: <b>круг ${this.autoLap}</b> (следующий свободный).`;
            } else {
                hint.innerHTML = `Вы выбрали <b>круг ${this.selectedLap}</b>.`;
            }
        } else {
            hint.innerHTML = `Редактирование отсечки на <b>круге ${this.selectedLap}</b>.`;
        }
    },

    checkConflicts() {
        const warn = document.getElementById('modalWarn');
        const msgs = [];

        const timeMs = this.getTimeFromInputs();
        if (timeMs < 0) msgs.push('Отрицательное время.');

        const now = Date.now();
        if (this.athlete && timeMs > (now - this.athlete.startTimeMs) + 120000) {
            msgs.push('Время сильно в будущем.');
        }

        const conflict = this.athlete.splits.findIndex((s, i) =>
            i !== this.splitIndex && s.lap === this.selectedLap
        );
        if (conflict !== -1) {
            msgs.push(`Круг ${this.selectedLap} уже записан — будет заменён.`);
        }

        if (msgs.length) {
            warn.textContent = msgs.join(' ');
            warn.hidden = false;
        } else {
            warn.hidden = true;
        }
    },

    setTimeFromMs(ms) {
        if (ms < 0) ms = 0;
        const totalSec = Math.floor(ms / 1000);
        const tenth = Math.floor((ms % 1000) / 100);
        document.getElementById('timeMin').value   = Math.floor(totalSec / 60);
        document.getElementById('timeSec').value   = totalSec % 60;
        document.getElementById('timeTenth').value = tenth;
        this.checkConflicts();
    },

    getTimeFromInputs() {
        const min   = parseInt(document.getElementById('timeMin').value, 10)   || 0;
        const sec   = parseInt(document.getElementById('timeSec').value, 10)   || 0;
        const tenth = parseInt(document.getElementById('timeTenth').value, 10) || 0;
        return (min * 60 + sec) * 1000 + tenth * 100;
    },

    show() {
        this.el.classList.add('is-open');
        document.body.style.overflow = 'hidden';
        this.isOpen = true;
    },

    close() {
        this.el.classList.remove('is-open');
        document.body.style.overflow = '';
        this.isOpen = false;
        this.athlete = null;
        this.splitIndex = -1;
    },

    save() {
        if (!this.athlete) return;

        this.clampInputs();

        const newLap = this.selectedLap;
        const newTimeMs = this.athlete.startTimeMs + this.getTimeFromInputs();

        if (this.mode === 'edit') {
            const currentSplit = this.athlete.splits[this.splitIndex];
            if (!currentSplit) { this.close(); return; }

            this.athlete.splits = this.athlete.splits.filter(s =>
                s === currentSplit || s.lap !== newLap
            );

            currentSplit.lap = newLap;
            currentSplit.timeMs = newTimeMs;
            currentSplit.wasAdjusted = true;
        } else {
            this.athlete.splits = this.athlete.splits.filter(s => s.lap !== newLap);
            this.athlete.splits.push({
                lap: newLap,
                timeMs: newTimeMs,
                wasAdjusted: newLap !== this.autoLap,
            });
        }

        this.athlete.splits.sort((a, b) => a.lap - b.lap);
        saveState();
        render();
        this.close();
    },
};

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render() {
    const cfg = RACE_CONFIG[state.raceType] || RACE_CONFIG.individual;
    const maxLaps = cfg.laps;

    document.getElementById('setupPanel').hidden = state.started;
    document.getElementById('trackerPanel').hidden = !state.started;

    if (!state.started) return;

    document.getElementById('infoStart').textContent = state.firstStartTimeStr;
    document.getElementById('infoType').textContent = cfg.short;
    document.getElementById('infoInterval').textContent = state.intervalSec + ' с';
    document.getElementById('infoLapTime').textContent = state.lapTimeSec > 0
        ? formatDuration(state.lapTimeSec * 1000)
        : '—';

    const list = document.getElementById('athletesList');

    if (state.athletes.length === 0) {
        list.innerHTML = `<div class="empty-state">
            Добавьте первого спортсмена, чтобы начать отслеживание.
        </div>`;
        return;
    }

    // Лидеры по каждому кругу
    const lapLeaders = computeLapLeaders();

    list.innerHTML = state.athletes.map(athlete => {

        // Кнопки кругов
        const lapButtons = Array.from({ length: maxLaps }, (_, i) => {
            const lap = i + 1;
            const done = athlete.splits.some(s => s.lap === lap);
            const cls = 'lap-btn' + (done ? ' is-done' : '');
            const sub = done ? '<span class="lap-btn__sub">записан</span>' : '';
            return `<button type="button" class="${cls}"
                            data-action="lap"
                            data-number="${athlete.number}"
                            data-lap="${lap}">
                        Круг ${lap}
                        ${sub}
                    </button>`;
        }).join('');

        // Строки отсечек с отставанием от лидера на этом круге
        const splits = athlete.splits.map((s, idx) => {
            const fromStart = s.timeMs - athlete.startTimeMs;

            // Отставание от лидера на данном круге
            const leader = lapLeaders[s.lap];
            let gapClass, gapText, gapLabel;
            if (!leader) {
                gapClass = '';
                gapText = '';
                gapLabel = '';
            } else {
                const gap = fromStart - leader.timeMs;
                const isSelf = athlete.number === leader.athleteNumber;

                if (gap <= 0) {
                    // Сам лидер на круге (или делим с ним первое место)
                    gapClass = 'is-leading';
                    gapText = 'лидер';
                    gapLabel = 'на круге';
                } else {
                    gapClass = 'is-losing';
                    gapText = formatGap(gap);
                    gapLabel = `от #${leader.athleteNumber}`;
                }
            }

            const gapBlock = gapText
                ? `<span class="split-row__gap ${gapClass}">
                        ${gapText}
                        <small>${gapLabel}</small>
                   </span>`
                : `<span class="split-row__gap"></span>`;

            const mark = s.wasAdjusted ? ' · ручн.' : '';

            return `<div class="split-row"
                         data-action="edit-split"
                         data-number="${athlete.number}"
                         data-index="${idx}"
                         role="button"
                         tabindex="0">
                <span class="split-row__lap">${s.lap}</span>
                <span class="split-row__main">
                    <span class="split-row__time">${formatDuration(fromStart)}</span>
                    <span class="split-row__sub">от старта${mark}</span>
                </span>
                ${gapBlock}
                <span class="split-row__actions">
                    <button class="icon-btn icon-btn--danger" type="button"
                            data-action="remove-split"
                            data-number="${athlete.number}"
                            data-index="${idx}"
                            aria-label="Удалить">✕</button>
                </span>
            </div>`;
        }).join('');

        const splitsBlock = splits ? `<div class="splits-list">${splits}</div>` : '';

        return `<div class="athlete-card" data-number="${athlete.number}">
            <div class="athlete-card__head">
                <span class="athlete-card__number">#${athlete.number}</span>
                <span class="athlete-card__start">
                    Старт
                    <strong>${formatClock(athlete.startTimeMs)}</strong>
                </span>
                <span class="athlete-card__actions">
                    <button class="icon-btn icon-btn--danger" type="button"
                            data-action="remove-athlete"
                            data-number="${athlete.number}"
                            aria-label="Убрать">✕</button>
                </span>
            </div>

            <button class="quick-split" type="button"
                    data-action="quick-split"
                    data-number="${athlete.number}">
                ⚡ Быстрая отсечка (текущее время + авто-круг)
            </button>

            <div class="lap-buttons">${lapButtons}</div>
            ${splitsBlock}
        </div>`;
    }).join('');
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
document.getElementById('startBtn').addEventListener('click', startRace);
document.getElementById('changeSetupBtn').addEventListener('click', changeSetup);

document.getElementById('addAthleteBtn').addEventListener('click', () => {
    const input = document.getElementById('athleteNumber');
    const num = parseInt(input.value, 10);
    if (isNaN(num)) { alert('Введите номер участника'); return; }
    addAthlete(num);
    input.value = '';
    input.focus();
});

document.getElementById('athleteNumber').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('addAthleteBtn').click();
    }
});

document.getElementById('athletesList').addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;

    const action = el.dataset.action;
    const number = parseInt(el.dataset.number, 10);
    const athlete = state.athletes.find(a => a.number === number);
    if (!athlete) return;

    if (action === 'remove-athlete') {
        removeAthlete(number);

    } else if (action === 'quick-split') {
        const now = Date.now();
        const maxLaps = RACE_CONFIG[state.raceType].laps;
        const lap = detectLap(athlete, now, state.lapTimeSec, maxLaps);
        athlete.splits = athlete.splits.filter(s => s.lap !== lap);
        athlete.splits.push({ lap, timeMs: now, wasAdjusted: false });
        athlete.splits.sort((a, b) => a.lap - b.lap);
        saveState();
        render();

    } else if (action === 'lap') {
        const lap = parseInt(el.dataset.lap, 10);
        modal.openNew(athlete, lap);

    } else if (action === 'edit-split') {
        const idx = parseInt(el.dataset.index, 10);
        if (isNaN(idx)) return;
        modal.openEdit(athlete, idx);

    } else if (action === 'remove-split') {
        const idx = parseInt(el.dataset.index, 10);
        const split = athlete.splits[idx];
        if (!split) return;
        if (!confirm(`Удалить отсечку на круге ${split.lap} у #${number}?`)) return;
        athlete.splits.splice(idx, 1);
        saveState();
        render();
    }
});

/* ============================================================
   ЧАСЫ
   ============================================================ */
function tickClock() {
    document.getElementById('clock').textContent = formatClock(Date.now());
}
setInterval(tickClock, 250);
tickClock();

/* ============================================================
   СТАРТ
   ============================================================ */
modal.init();
loadState();
render();
</script>
</body>
</html>
