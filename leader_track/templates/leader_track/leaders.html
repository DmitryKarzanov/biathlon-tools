<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>Отслеживание лидеров — tool_for_biathlon</title>

    <style>
        :root {
            --blue: #4A8BF0;
            --blue-solid: #174A99;
            --blue-hover: #1a5cb5;
            --red: #E14A2E;
            --green: #22c55e;
            --gray: #E3E3E3;
            --text: #14181F;
            --muted: #6B7280;
            --radius: 14px;
            --container: 720px;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            position: relative;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                         'Helvetica Neue', Arial, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            color: #fff;
            background-color: #000;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: calc(20px + var(--safe-bottom));
        }

        body::before {
            content: "";
            position: fixed; inset: 0; z-index: -2;
            background-color: #000;
            background-image: url('https://i.pinimg.com/1200x/6c/29/98/6c2998bd3d41c11cb3e066937b584c81.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            filter: grayscale(100%) contrast(1.05) brightness(.65);
        }

        body::after {
            content: "";
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(0,0,0,.35), transparent 60%),
                linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.82) 100%);
            pointer-events: none;
        }

        img, svg { display: block; max-width: 100%; }
        a { color: inherit; }

        .container {
            width: 100%;
            max-width: var(--container);
            margin: 0 auto;
            padding: 0 12px;
        }

        /* ============================================================
           ЛИПКАЯ ШАПКА
           ============================================================ */
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,.12);
            padding-top: var(--safe-top);
        }

        .sticky-header__inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
        }

        .sticky-header__title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            min-width: 0;
        }

        .sticky-header__clock {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .5);
            border: 1px solid rgba(255,255,255,.14);
            font-size: 15px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .sticky-header__clock::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 0 0 rgba(225, 74, 46, .6);
            animation: pulse 1.9s infinite;
        }

        @keyframes pulse {
            0%   { box-shadow: 0 0 0 0 rgba(225, 74, 46, .55); }
            70%  { box-shadow: 0 0 0 9px rgba(225, 74, 46, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 74, 46, 0); }
        }

        /* ============================================================
           ОСНОВНОЙ БЛОК
           ============================================================ */
        .main { padding: 14px 0 30px; }

        /* ---------- ПАНЕЛИ ---------- */
        .panel {
            background: rgba(10, 10, 10, .78);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: var(--radius);
            padding: 18px 16px;
            margin-bottom: 14px;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .panel__title {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: rgba(255,255,255,.55);
            margin-bottom: 14px;
        }

        /* ---------- ФОРМА НАСТРОЙКИ ---------- */
        .setup-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field__label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
            color: rgba(255,255,255,.55);
        }

        .field__hint {
            font-size: 12px;
            color: rgba(255,255,255,.45);
            margin-top: 2px;
        }

        .input,
        .select {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,.2);
            background: rgba(0, 0, 0, .5);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            outline: none;
            transition: border-color .18s ease, box-shadow .18s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        .input:focus,
        .select:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px rgba(74, 139, 240, .22);
        }

        .select {
            background-image:
                linear-gradient(45deg, transparent 50%, #fff 50%),
                linear-gradient(135deg, #fff 50%, transparent 50%);
            background-position:
                calc(100% - 18px) calc(50% - 2px),
                calc(100% - 13px) calc(50% - 2px);
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
            padding-right: 36px;
            cursor: pointer;
        }

        .select option { background: #1a1a1a; color: #fff; }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* ---------- КНОПКИ ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: .01em;
            cursor: pointer;
            text-decoration: none;
            transition: background-color .18s ease, transform .12s ease,
                        box-shadow .18s ease, opacity .18s ease;
            user-select: none;
        }

        .btn:active { transform: scale(.98); }

        .btn--primary {
            background: var(--blue-solid);
            color: #fff;
        }

        .btn--primary:hover:not(:disabled) {
            background: var(--blue-hover);
            box-shadow: 0 8px 20px rgba(23, 74, 153, .4);
        }

        .btn--primary:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn--ghost {
            background: transparent;
            border: 1.5px solid rgba(255,255,255,.3);
            color: #fff;
        }

        .btn--ghost:hover { border-color: rgba(255,255,255,.6); }

        .btn--danger {
            background: transparent;
            border: 1.5px solid rgba(225, 74, 46, .5);
            color: #ff8b73;
        }

        .btn--danger:hover {
            background: rgba(225, 74, 46, .15);
            border-color: var(--red);
        }

        .btn--full { width: 100%; }

        /* ---------- КОМПАКТНАЯ ПАНЕЛЬ ГОНКИ ---------- */
        .race-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            align-items: center;
        }

        .race-item {
            display: inline-flex;
            flex-direction: column;
            gap: 2px;
            font-size: 12px;
        }

        .race-item__label {
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: rgba(255,255,255,.5);
            font-size: 10px;
        }

        .race-item__value {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .race-bar .btn {
            margin-left: auto;
            min-height: 38px;
            padding: 8px 14px;
            font-size: 13px;
        }

        /* ---------- ФОРМА ДОБАВЛЕНИЯ СПОРТСМЕНА ---------- */
        .add-athlete {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .add-athlete .input {
            flex: 1 1 auto;
            min-width: 0;
            font-size: 18px;
            font-weight: 700;
            text-align: center;
            letter-spacing: .05em;
            min-height: 52px;
        }

        .add-athlete .btn {
            flex: 0 0 auto;
            min-height: 52px;
            padding: 0 22px;
        }

        /* ============================================================
           КАРТОЧКА СПОРТСМЕНА
           ============================================================ */
        .athletes-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .empty-state {
            padding: 30px 16px;
            text-align: center;
            border: 1px dashed rgba(255,255,255,.18);
            border-radius: var(--radius);
            color: rgba(255,255,255,.55);
            font-size: 14px;
            line-height: 1.5;
        }

        .athlete-card {
            background: rgba(10, 10, 10, .82);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: var(--radius);
            padding: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color .2s ease;
        }

        .athlete-card.is-active {
            border-color: rgba(74, 139, 240, .6);
            box-shadow: 0 0 0 3px rgba(74, 139, 240, .12);
        }

        .athlete-card__head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .athlete-card__number {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--blue);
            line-height: 1;
        }

        .athlete-card__start {
            font-size: 12px;
            color: rgba(255,255,255,.6);
            font-variant-numeric: tabular-nums;
            line-height: 1.3;
        }

        .athlete-card__start strong {
            display: block;
            font-size: 14px;
            color: #fff;
            font-weight: 700;
        }

        .athlete-card__actions {
            margin-left: auto;
            display: inline-flex;
            gap: 6px;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 11px;
            border: 1px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.05);
            color: rgba(255,255,255,.85);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            font-family: inherit;
            transition: background-color .15s ease, color .15s ease,
                        border-color .15s ease, transform .1s ease;
            user-select: none;
        }

        .icon-btn:active { transform: scale(.94); }

        .icon-btn:hover {
            background: rgba(255,255,255,.12);
            border-color: rgba(255,255,255,.4);
            color: #fff;
        }

        .icon-btn--danger:hover {
            background: rgba(225, 74, 46, .25);
            border-color: var(--red);
            color: #fff;
        }

        /* ---------- КНОПКИ КРУГОВ ---------- */
        .lap-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(56px, 1fr));
            gap: 8px;
            margin-bottom: 10px;
        }

        .lap-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            min-height: 56px;
            padding: 8px 4px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,.22);
            background: rgba(0, 0, 0, .35);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color .15s ease, border-color .15s ease,
                        transform .1s ease, opacity .2s ease;
            user-select: none;
            -webkit-user-select: none;
        }

        .lap-btn__sub {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
        }

        .lap-btn:active { transform: scale(.96); }

        .lap-btn:not(:disabled):hover {
            background: var(--blue-solid);
            border-color: var(--blue-solid);
        }

        .lap-btn.is-done {
            background: rgba(34, 197, 94, .12);
            border-color: rgba(34, 197, 94, .5);
            color: #bbf7d0;
            cursor: default;
        }

        .lap-btn.is-done:active { transform: none; }

        /* ---------- КНОПКА БЫСТРОЙ ОТСЕЧКИ ---------- */
        .quick-split {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 44px;
            padding: 10px 14px;
            border-radius: 11px;
            border: 1.5px dashed rgba(74, 139, 240, .5);
            background: rgba(74, 139, 240, .08);
            color: #b6d4ff;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color .15s ease, border-color .15s ease;
            user-select: none;
            width: 100%;
            margin-bottom: 10px;
        }

        .quick-split:hover {
            background: rgba(74, 139, 240, .18);
            border-color: var(--blue);
            color: #fff;
        }

        .quick-split:active { transform: scale(.99); }

        /* ---------- СПИСОК ОТСЕЧЕК ---------- */
        .splits-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .split-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(255,255,255,.08);
            animation: slideIn .25s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .split-row__lap {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 34px;
            height: 34px;
            border-radius: 9px;
            background: rgba(74, 139, 240, .18);
            color: var(--blue);
            font-size: 14px;
            font-weight: 800;
        }

        .split-row__time {
            font-size: 18px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.01em;
            color: #fff;
            flex: 1 1 auto;
            min-width: 0;
        }

        .split-row__time small {
            display: block;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: rgba(255,255,255,.45);
            margin-top: 2px;
        }

        .split-row__actions {
            display: inline-flex;
            gap: 4px;
        }

        .split-row__actions .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            font-size: 15px;
        }

        /* ============================================================
           МОДАЛКА
           ============================================================ */
        .modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: flex-end;
            justify-content: center;
            padding: 0;
        }

        .modal.is-open { display: flex; }

        .modal__overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            animation: fadeIn .2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .modal__content {
            position: relative;
            width: 100%;
            max-width: 520px;
            max-height: 92vh;
            overflow-y: auto;
            background: #0e0e0e;
            border-top-left-radius: 22px;
            border-top-right-radius: 22px;
            border: 1px solid rgba(255,255,255,.12);
            border-bottom: none;
            box-shadow: 0 -20px 40px rgba(0, 0, 0, .5);
            padding: 18px 16px calc(18px + var(--safe-bottom));
            animation: slideUp .25s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        @media (min-width: 640px) {
            .modal { align-items: center; padding: 20px; }
            .modal__content {
                border-radius: 22px;
                border-bottom: 1px solid rgba(255,255,255,.12);
                padding: 22px 22px;
            }
            @keyframes slideUp {
                from { transform: translateY(8px) scale(.98); opacity: 0; }
                to   { transform: translateY(0)    scale(1);   opacity: 1; }
            }
        }

        .modal__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }

        .modal__title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.01em;
        }

        .modal__title span { color: var(--blue); }

        .modal__close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.05);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }

        .modal__close:hover {
            background: rgba(255,255,255,.12);
        }

        .modal__section {
            margin-bottom: 18px;
        }

        .modal__label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: rgba(255,255,255,.5);
            margin-bottom: 8px;
        }

        .modal__hint {
            font-size: 12px;
            color: rgba(255,255,255,.55);
            margin-top: 6px;
            line-height: 1.4;
        }

        .modal__hint b { color: #b6d4ff; }

        /* ---------- ВЫБОР КРУГА В МОДАЛКЕ ---------- */
        .lap-picker {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(48px, 1fr));
            gap: 8px;
        }

        .lap-pick {
            min-height: 48px;
            border-radius: 10px;
            border: 1.5px solid rgba(255,255,255,.2);
            background: rgba(0, 0, 0, .4);
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all .15s ease;
        }

        .lap-pick:active { transform: scale(.96); }

        .lap-pick.is-selected {
            background: var(--blue-solid);
            border-color: var(--blue-solid);
            box-shadow: 0 0 0 3px rgba(74, 139, 240, .25);
        }

        /* ---------- ВВОД ВРЕМЕНИ ---------- */
        .time-input {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 12px;
            border-radius: 14px;
            background: rgba(0, 0, 0, .5);
            border: 1.5px solid rgba(255,255,255,.15);
        }

        .time-input input {
            width: 68px;
            height: 56px;
            border-radius: 10px;
            border: 1.5px solid rgba(255,255,255,.18);
            background: rgba(255,255,255,.04);
            color: #fff;
            font-family: inherit;
            font-size: 24px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
            appearance: textfield;
            transition: border-color .15s ease;
        }

        .time-input input::-webkit-outer-spin-button,
        .time-input input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .time-input input:focus {
            border-color: var(--blue);
            background: rgba(74, 139, 240, .08);
        }

        .time-input__sep {
            font-size: 26px;
            font-weight: 800;
            color: rgba(255,255,255,.5);
            user-select: none;
        }

        .time-input__tenth {
            width: 52px !important;
        }

        .time-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .time-actions .btn {
            flex: 1;
            min-height: 40px;
            font-size: 13px;
        }

        /* ---------- КНОПКИ МОДАЛКИ ---------- */
        .modal__actions {
            display: flex;
            gap: 10px;
            padding-top: 6px;
        }

        .modal__actions .btn {
            flex: 1;
            min-height: 50px;
        }

        /* ---------- ПРЕДУПРЕЖДЕНИЕ ---------- */
        .modal__warn {
            display: flex;
            gap: 8px;
            align-items: flex-start;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(225, 74, 46, .12);
            border: 1px solid rgba(225, 74, 46, .35);
            font-size: 12px;
            line-height: 1.45;
            color: #ffc4b5;
            margin-top: 8px;
        }

        /* ============================================================
           АДАПТИВ
           ============================================================ */
        @media (min-width: 480px) {
            .container { padding: 0 16px; }
            .panel { padding: 20px 18px; }
            .athlete-card { padding: 16px; }
        }

        @media (min-width: 720px) {
            .sticky-header__title { font-size: 16px; }
        }
    </style>
</head>

<body>

<!-- ======================= ЛИПКАЯ ШАПКА ======================= -->
<header class="sticky-header">
    <div class="container sticky-header__inner">
        <div class="sticky-header__title">
            Отслеживание лидеров
        </div>
        <div class="sticky-header__clock" id="clock">--:--:--</div>
    </div>
</header>

<!-- ======================= ОСНОВНОЕ ======================= -->
<main class="main">
    <div class="container">

        <!-- ============ ЭКРАН НАСТРОЙКИ ============ -->
        <section class="panel" id="setupPanel">
            <h2 class="panel__title">Настройки гонки</h2>

            <div class="setup-form">
                <div class="field">
                    <label class="field__label" for="firstStart">Старт первого участника</label>
                    <input class="input" type="time" id="firstStart" step="1" value="11:00:00">
                </div>

                <div class="field">
                    <label class="field__label" for="raceType">Тип гонки</label>
                    <select class="select" id="raceType">
                        <option value="individual">Индивидуальная (5 кругов)</option>
                        <option value="sprint">Спринт (3 круга)</option>
                    </select>
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label class="field__label" for="interval">Интервал старта, сек</label>
                        <input class="input" type="number" id="interval"
                               min="0" max="600" step="5" value="30"
                               inputmode="numeric">
                    </div>
                    <div class="field">
                        <label class="field__label" for="lapTime">Время круга, мин:сек</label>
                        <input class="input" type="text" id="lapTime"
                               placeholder="8:00" value=""
                               inputmode="numeric">
                    </div>
                </div>
                <div class="field__hint">
                    Время круга — необязательно. Если указать — программа точнее определит круг.
                </div>

                <button class="btn btn--primary btn--full" id="startBtn" type="button">
                    Начать гонку
                </button>
            </div>
        </section>

        <!-- ============ ЭКРАН ТРЕКЕРА ============ -->
        <section id="trackerPanel" hidden>

            <!-- Компактная инфо-панель -->
            <div class="panel">
                <div class="race-bar">
                    <div class="race-item">
                        <span class="race-item__label">Старт #1</span>
                        <span class="race-item__value" id="infoStart">—</span>
                    </div>
                    <div class="race-item">
                        <span class="race-item__label">Гонка</span>
                        <span class="race-item__value" id="infoType">—</span>
                    </div>
                    <div class="race-item">
                        <span class="race-item__label">Интервал</span>
                        <span class="race-item__value" id="infoInterval">—</span>
                    </div>
                    <div class="race-item">
                        <span class="race-item__label">Круг</span>
                        <span class="race-item__value" id="infoLapTime">—</span>
                    </div>
                    <button class="btn btn--ghost" id="changeSetupBtn" type="button">
                        Изменить
                    </button>
                </div>
            </div>

            <!-- Добавление спортсмена -->
            <div class="panel">
                <h2 class="panel__title">Добавить спортсмена</h2>
                <div class="add-athlete">
                    <input class="input" type="number" id="athleteNumber"
                           min="1" max="999" step="1" inputmode="numeric"
                           placeholder="Номер">
                    <button class="btn btn--primary" id="addAthleteBtn" type="button">
                        Следить
                    </button>
                </div>
            </div>

            <!-- Список спортсменов -->
            <div class="athletes-list" id="athletesList"></div>

        </section>

    </div>
</main>

<!-- ======================= МОДАЛКА ОТСЕЧКИ ======================= -->
<div class="modal" id="splitModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content">

        <div class="modal__head">
            <h3 class="modal__title" id="modalTitle">
                Отсечка <span id="modalAthleteNumber">#—</span>
            </h3>
            <button class="modal__close" type="button" data-close aria-label="Закрыть">✕</button>
        </div>

        <!-- Круг -->
        <div class="modal__section">
            <span class="modal__label">Круг</span>
            <div class="lap-picker" id="lapPicker"></div>
            <div class="modal__hint" id="lapHint"></div>
        </div>

        <!-- Время -->
        <div class="modal__section">
            <span class="modal__label">Время от старта</span>
            <div class="time-input">
                <input type="number" id="timeMin" min="0" max="99" value="0" inputmode="numeric">
                <span class="time-input__sep">:</span>
                <input type="number" id="timeSec" min="0" max="59" value="0" inputmode="numeric">
                <span class="time-input__sep">.</span>
                <input type="number" id="timeTenth" min="0" max="9" value="0"
                       class="time-input__tenth" inputmode="numeric">
            </div>

            <div class="time-actions">
                <button class="btn btn--ghost" type="button" data-time-action="-1">− 1 сек</button>
                <button class="btn btn--ghost" type="button" data-time-action="+1">+ 1 сек</button>
                <button class="btn btn--ghost" type="button" data-time-action="now">
                    Сейчас
                </button>
            </div>
        </div>

        <!-- Предупреждение -->
        <div class="modal__warn" id="modalWarn" hidden></div>

        <!-- Кнопки -->
        <div class="modal__actions">
            <button class="btn btn--ghost" type="button" data-close>Отмена</button>
            <button class="btn btn--primary" type="button" id="saveSplitBtn">Сохранить</button>
        </div>

    </div>
</div>

<script>
/* ============================================================
   КОНСТАНТЫ
   ============================================================ */
const STORAGE_KEY = 'biathlon_leaders_v2';

const RACE_CONFIG = {
    individual: { label: 'Индивидуальная (5 кругов)', laps: 5 },
    sprint:     { label: 'Спринт (3 круга)',         laps: 3 },
};

const DEFAULT_STATE = {
    version: 2,
    started: false,
    firstStartTimeStr: '11:00:00',
    firstStartTimeMs: null,
    raceType: 'individual',
    intervalSec: 30,
    lapTimeSec: 0,       // 0 = не указано
    athletes: [],        // { number, startTimeMs, splits: [{ lap, timeMs, wasAdjusted }] }
};

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function pad(n) { return String(n).padStart(2, '0'); }

function formatClock(ms) {
    const d = new Date(ms);
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

/** ms -> "MM:SS.d" или "H:MM:SS.d" */
function formatDuration(ms) {
    if (ms == null || isNaN(ms)) return '—';
    if (ms < 0) ms = 0;
    const totalSec = ms / 1000;
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = Math.floor(totalSec % 60);
    const tenth = Math.floor((totalSec * 10) % 10);
    return h > 0
        ? `${h}:${pad(m)}:${pad(s)}.${tenth}`
        : `${pad(m)}:${pad(s)}.${tenth}`;
}

/** "MM:SS.d" или просто секунды -> ms */
function parseDuration(str) {
    if (str == null) return 0;
    str = String(str).trim().replace(',', '.');
    if (!str) return 0;
    if (str.includes(':')) {
        const parts = str.split(':').map(Number);
        let h = 0, m = 0, s = 0;
        if (parts.length === 3) [h, m, s] = parts;
        else                    [m, s] = parts;
        return Math.round((h * 3600 + m * 60 + s) * 1000);
    }
    return Math.round(parseFloat(str) * 1000);
}

/** ms -> { min, sec, tenth } */
function msToParts(ms) {
    if (ms < 0) ms = 0;
    const totalSec = Math.floor(ms / 1000);
    const tenth = Math.floor((ms % 1000) / 100);
    return {
        min:   Math.floor(totalSec / 60),
        sec:   totalSec % 60,
        tenth: tenth,
    };
}

function partsToMs(min, sec, tenth) {
    return ((+min || 0) * 60 + (+sec || 0)) * 1000 + (+tenth || 0) * 100;
}

function parseStartTime(timeStr) {
    if (!timeStr) return null;
    const [h, m, s = 0] = timeStr.split(':').map(Number);
    if (isNaN(h) || isNaN(m)) return null;
    const d = new Date();
    d.setHours(h, m, Math.floor(s), 0);
    return d.getTime();
}

function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
}

/* ============================================================
   СОХРАНЕНИЕ
   ============================================================ */
function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.warn('Не удалось сохранить:', e);
    }
}

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.version !== 2) return;   // старую версию игнорируем
        state = { ...DEFAULT_STATE, ...parsed };
        if (!Array.isArray(state.athletes)) state.athletes = [];
        state.athletes.forEach(a => {
            if (!Array.isArray(a.splits)) a.splits = [];
        });
    } catch (e) {
        console.warn('Не удалось загрузить:', e);
    }
}

/* ============================================================
   ОПРЕДЕЛЕНИЕ КРУГА (эвристика)
   ============================================================
   Алгоритм определяет круг на основе:
   1. Прошедшего времени от старта и примерного времени круга.
   2. Уже записанных кругов спортсмена (нельзя записать круг N+1, если N+1 уже записан).
   3. Защиты от «нулевого» круга.
   4. При отсутствии времени круга — берётся следующий свободный круг.
*/
function detectLap(athlete, splitTimeMs, lapTimeSec, maxLaps) {
    const elapsedSec = (splitTimeMs - athlete.startTimeMs) / 1000;
    const usedLaps = new Set(athlete.splits.map(s => s.lap));

    let guess;
    if (lapTimeSec > 0) {
        // Ожидаем, что за время elapsedSec прошло примерно round(elapsedSec / lapTimeSec) кругов
        guess = Math.round(elapsedSec / lapTimeSec);
        guess = Math.max(1, Math.min(maxLaps, guess));
    } else {
        const maxUsed = athlete.splits.length
            ? Math.max(...athlete.splits.map(s => s.lap))
            : 0;
        guess = Math.min(maxLaps, maxUsed + 1);
    }

    // Если круг занят — пробуем следующий
    if (usedLaps.has(guess)) {
        for (let l = guess + 1; l <= maxLaps; l++) {
            if (!usedLaps.has(l)) { guess = l; break; }
        }
    }

    return guess;
}

/* ============================================================
   ДЕЙСТВИЯ
   ============================================================ */
function startRace() {
    const timeStr = document.getElementById('firstStart').value;
    const raceType = document.getElementById('raceType').value;
    const interval = parseInt(document.getElementById('interval').value, 10);
    const lapTimeStr = document.getElementById('lapTime').value.trim();

    if (!timeStr) { alert('Укажите время старта первого участника'); return; }
    if (isNaN(interval) || interval < 0) { alert('Введите корректный интервал'); return; }

    const firstMs = parseStartTime(timeStr);
    if (firstMs == null) { alert('Некорректный формат времени старта'); return; }

    state.firstStartTimeStr = timeStr;
    state.firstStartTimeMs = firstMs;
    state.raceType = raceType;
    state.intervalSec = interval;
    state.lapTimeSec = lapTimeStr ? Math.round(parseDuration(lapTimeStr) / 1000) : 0;
    state.started = true;

    saveState();
    render();
}

function resetAll() {
    if (!confirm('Сбросить всё: настройки, спортсменов и отсечки?')) return;
    state = JSON.parse(JSON.stringify(DEFAULT_STATE));
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    render();
}

function changeSetup() {
    if (!confirm('Вернуться к настройкам? Текущие данные будут удалены.')) return;
    resetAll();
}

function addAthlete(number) {
    if (!state.started) return;
    if (!Number.isInteger(number) || number < 1) {
        alert('Введите корректный номер (целое число ≥ 1)');
        return;
    }
    if (state.athletes.some(a => a.number === number)) {
        alert(`Участник #${number} уже отслеживается`);
        return;
    }

    const startTimeMs = state.firstStartTimeMs + (number - 1) * state.intervalSec * 1000;
    state.athletes.push({ number, startTimeMs, splits: [] });
    state.athletes.sort((a, b) => a.number - b.number);

    saveState();
    render();
}

function removeAthlete(number) {
    const a = state.athletes.find(x => x.number === number);
    if (!a) return;
    if (!confirm(`Убрать участника #${number} со всеми отсечками?`)) return;
    state.athletes = state.athletes.filter(x => x.number !== number);
    saveState();
    render();
}

/* ============================================================
   МОДАЛКА ОТСЕЧКИ
   ============================================================ */
const modal = {
    el: null,
    overlay: null,
    athlete: null,
    selectedLap: 1,
    initialLap: 1,
    initialTimeMs: 0,
    isNew: true,           // новая отсечка или редактирование
    editingLapIndex: -1,   // если редактируем существующую

    init() {
        this.el = document.getElementById('splitModal');
        this.overlay = this.el.querySelector('.modal__overlay');

        // Закрытие
        this.el.querySelectorAll('[data-close]').forEach(btn => {
            btn.addEventListener('click', () => this.close());
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && this.el.classList.contains('is-open')) {
                this.close();
            }
        });

        // Кнопки выбора круга
        document.getElementById('lapPicker').addEventListener('click', (e) => {
            const btn = e.target.closest('.lap-pick');
            if (!btn) return;
            this.selectLap(parseInt(btn.dataset.lap, 10));
        });

        // Кнопки времени
        this.el.querySelectorAll('[data-time-action]').forEach(btn => {
            btn.addEventListener('click', () => {
                const action = btn.dataset.timeAction;
                if (action === 'now') {
                    this.setTime(Date.now());
                } else {
                    const delta = parseInt(action, 10) * 1000;
                    const cur = this.getTime();
                    this.setTime(Math.max(0, cur + delta));
                }
            });
        });

        // Сохранение
        document.getElementById('saveSplitBtn').addEventListener('click', () => {
            this.save();
        });
    },

    openNew(athlete) {
        this.athlete = athlete;
        this.isNew = true;
        this.editingLapIndex = -1;

        const now = Date.now();
        const lapTimeSec = state.lapTimeSec;
        const maxLaps = RACE_CONFIG[state.raceType].laps;
        const lap = detectLap(athlete, now, lapTimeSec, maxLaps);

        this.selectedLap = lap;
        this.initialLap = lap;
        this.initialTimeMs = now - athlete.startTimeMs;
        this.renderLaps(maxLaps);
        this.setTime(now);

        this.renderHint(lap, true);
        this.showWarningIfBadTime();
        this.show();
    },

    openEdit(athlete, lapIndex) {
        const split = athlete.splits[lapIndex];
        if (!split) return;

        this.athlete = athlete;
        this.isNew = false;
        this.editingLapIndex = lapIndex;

        this.selectedLap = split.lap;
        this.initialLap = split.lap;
        this.initialTimeMs = split.timeMs - athlete.startTimeMs;

        const maxLaps = RACE_CONFIG[state.raceType].laps;
        this.renderLaps(maxLaps);
        this.setTime(split.timeMs);

        this.renderHint(split.lap, false);
        this.hideWarning();
        this.show();
    },

    show() {
        document.getElementById('modalAthleteNumber').textContent = '#' + this.athlete.number;
        this.el.classList.add('is-open');
        document.body.style.overflow = 'hidden';
    },

    close() {
        this.el.classList.remove('is-open');
        document.body.style.overflow = '';
        this.athlete = null;
    },

    renderLaps(maxLaps) {
        const picker = document.getElementById('lapPicker');
        let html = '';
        for (let i = 1; i <= maxLaps; i++) {
            const cls = i === this.selectedLap ? 'lap-pick is-selected' : 'lap-pick';
            html += `<button type="button" class="${cls}" data-lap="${i}">${i}</button>`;
        }
        picker.innerHTML = html;
    },

    selectLap(lap) {
        this.selectedLap = lap;
        document.querySelectorAll('.lap-pick').forEach(el => {
            el.classList.toggle('is-selected', parseInt(el.dataset.lap, 10) === lap);
        });
        this.renderHint(lap, false);
    },

    renderHint(lap, isAuto) {
        const hint = document.getElementById('lapHint');
        const wasManual = lap !== this.initialLap;
        const maxLaps = RACE_CONFIG[state.raceType].laps;

        if (wasManual) {
            hint.innerHTML = `Вы выбрали круг <b>${lap}</b> из ${maxLaps}.`;
        } else if (isAuto) {
            hint.innerHTML = state.lapTimeSec > 0
                ? `Определено автоматически по времени круга: круг <b>${lap}</b> из ${maxLaps}.`
                : `Определено автоматически (следующий свободный): круг <b>${lap}</b> из ${maxLaps}.`;
        } else {
            hint.innerHTML = `Круг <b>${lap}</b> из ${maxLaps}.`;
        }
    },

    setTime(absTimeMs) {
        if (this.athlete) {
            const fromStart = Math.max(0, absTimeMs - this.athlete.startTimeMs);
            const p = msToParts(fromStart);
            document.getElementById('timeMin').value   = p.min;
            document.getElementById('timeSec').value   = p.sec;
            document.getElementById('timeTenth').value = p.tenth;
        }
        this.showWarningIfBadTime();
    },

    getTime() {
        const min   = parseInt(document.getElementById('timeMin').value, 10)   || 0;
        const sec   = parseInt(document.getElementById('timeSec').value, 10)   || 0;
        const tenth = parseInt(document.getElementById('timeTenth').value, 10) || 0;
        return partsToMs(min, sec, tenth);
    },

    getAbsTime() {
        return this.athlete.startTimeMs + this.getTime();
    },

    showWarningIfBadTime() {
        const warn = document.getElementById('modalWarn');
        if (!this.athlete) { warn.hidden = true; return; }

        const elapsed = this.getTime();
        const messages = [];

        if (elapsed < 0) {
            messages.push('Время от старта отрицательное.');
        }

        const now = Date.now();
        const abs = this.getAbsTime();
        if (abs > now + 1000) {
            messages.push('Время в будущем — это может быть ошибкой.');
        }

        // Проверка на уже записанный круг
        const others = this.athlete.splits.filter((_, i) =>
            i !== (this.isNew ? -1 : this.editingLapIndex)
        );
        if (others.some(s => s.lap === this.selectedLap)) {
            messages.push(`Круг ${this.selectedLap} уже записан — он будет перезаписан.`);
        }

        if (messages.length) {
            warn.textContent = messages.join(' ');
            warn.hidden = false;
        } else {
            warn.hidden = true;
        }
    },

    save() {
        if (!this.athlete) return;

        const lap = this.selectedLap;
        const absTimeMs = this.getAbsTime();
        const wasAdjusted = lap !== this.initialLap || this.getTime() !== this.initialTimeMs;

        if (this.isNew) {
            // Удаляем предыдущую отсечку на том же круге (перезапись)
            this.athlete.splits = this.athlete.splits.filter(s => s.lap !== lap);
            this.athlete.splits.push({ lap, timeMs: absTimeMs, wasAdjusted });
            this.athlete.splits.sort((a, b) => a.lap - b.lap);
        } else {
            this.athlete.splits[this.editingLapIndex] = {
                lap, timeMs: absTimeMs, wasAdjusted
            };
            this.athlete.splits.sort((a, b) => a.lap - b.lap);
        }

        saveState();
        render();
        this.close();
    },
};

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render() {
    const cfg = RACE_CONFIG[state.raceType] || RACE_CONFIG.individual;
    const maxLaps = cfg.laps;

    // Показ панелей
    document.getElementById('setupPanel').hidden = state.started;
    document.getElementById('trackerPanel').hidden = !state.started;

    if (!state.started) return;

    // Инфо
    document.getElementById('infoStart').textContent = state.firstStartTimeStr;
    document.getElementById('infoType').textContent = cfg.label.split(' (')[0];
    document.getElementById('infoInterval').textContent = state.intervalSec + ' с';
    document.getElementById('infoLapTime').textContent = state.lapTimeSec > 0
        ? formatDuration(state.lapTimeSec * 1000)
        : '—';

    const list = document.getElementById('athletesList');

    if (state.athletes.length === 0) {
        list.innerHTML = `<div class="empty-state">
            Добавьте первого спортсмена, чтобы начать отслеживание.
        </div>`;
        return;
    }

    list.innerHTML = state.athletes.map(athlete => {

        // Кнопки кругов
        const lapButtons = Array.from({ length: maxLaps }, (_, i) => {
            const lap = i + 1;
            const done = athlete.splits.some(s => s.lap === lap);
            const cls = 'lap-btn' + (done ? ' is-done' : '');
            const sub = done ? '<span class="lap-btn__sub">записан</span>' : '';
            return `<button type="button" class="${cls}"
                            data-action="lap"
                            data-number="${athlete.number}"
                            data-lap="${lap}">
                        Круг ${lap}
                        ${sub}
                    </button>`;
        }).join('');

        // Строки отсечек
        const splits = athlete.splits.map((s, idx) => {
            const fromStart = s.timeMs - athlete.startTimeMs;
            return `<div class="split-row">
                <span class="split-row__lap">${s.lap}</span>
                <span class="split-row__time">
                    ${formatDuration(fromStart)}
                    <small>от старта</small>
                </span>
                <span class="split-row__actions">
                    <button class="icon-btn" type="button"
                            data-action="edit-split"
                            data-number="${athlete.number}"
                            data-index="${idx}"
                            title="Изменить">✎</button>
                    <button class="icon-btn icon-btn--danger" type="button"
                            data-action="remove-split"
                            data-number="${athlete.number}"
                            data-index="${idx}"
                            title="Удалить">✕</button>
                </span>
            </div>`;
        }).join('');

        const splitsBlock = splits
            ? `<div class="splits-list">${splits}</div>`
            : '';

        return `<div class="athlete-card" data-number="${athlete.number}">
            <div class="athlete-card__head">
                <span class="athlete-card__number">#${athlete.number}</span>
                <span class="athlete-card__start">
                    Старт
                    <strong>${formatClock(athlete.startTimeMs)}</strong>
                </span>
                <span class="athlete-card__actions">
                    <button class="icon-btn icon-btn--danger" type="button"
                            data-action="remove-athlete"
                            data-number="${athlete.number}"
                            title="Убрать">✕</button>
                </span>
            </div>

            <button class="quick-split" type="button"
                    data-action="quick-split"
                    data-number="${athlete.number}">
                ⚡ Быстрая отсечка (текущее время + авто-круг)
            </button>

            <div class="lap-buttons">${lapButtons}</div>
            ${splitsBlock}
        </div>`;
    }).join('');
}

/* ============================================================
   СОБЫТИЯ
   ============================================================ */
document.getElementById('startBtn').addEventListener('click', startRace);
document.getElementById('changeSetupBtn').addEventListener('click', changeSetup);

document.getElementById('addAthleteBtn').addEventListener('click', () => {
    const input = document.getElementById('athleteNumber');
    const num = parseInt(input.value, 10);
    if (isNaN(num)) { alert('Введите номер участника'); return; }
    addAthlete(num);
    input.value = '';
    input.focus();
});

document.getElementById('athleteNumber').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('addAthleteBtn').click();
    }
});

// Делегирование событий по списку спортсменов
document.getElementById('athletesList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;

    const action = btn.dataset.action;
    const number = parseInt(btn.dataset.number, 10);
    const athlete = state.athletes.find(a => a.number === number);
    if (!athlete) return;

    if (action === 'remove-athlete') {
        removeAthlete(number);

    } else if (action === 'lap') {
        // Кнопка конкретного круга → открываем модалку сразу с выбранным кругом
        const lap = parseInt(btn.dataset.lap, 10);
        modal.openNew(athlete);
        modal.selectLap(lap);

    } else if (action === 'quick-split') {
        // Быстрая отсечка — сразу сохраняем с авто-кругом
        const now = Date.now();
        const maxLaps = RACE_CONFIG[state.raceType].laps;
        const lap = detectLap(athlete, now, state.lapTimeSec, maxLaps);
        athlete.splits = athlete.splits.filter(s => s.lap !== lap);
        athlete.splits.push({ lap, timeMs: now, wasAdjusted: false });
        athlete.splits.sort((a, b) => a.lap - b.lap);
        saveState();
        render();

    } else if (action === 'edit-split') {
        const idx = parseInt(btn.dataset.index, 10);
        modal.openEdit(athlete, idx);

    } else if (action === 'remove-split') {
        const idx = parseInt(btn.dataset.index, 10);
        const split = athlete.splits[idx];
        if (!split) return;
        if (!confirm(`Удалить отсечку на круге ${split.lap} у #${number}?`)) return;
        athlete.splits.splice(idx, 1);
        saveState();
        render();
    }
});

/* ============================================================
   ЧАСЫ
   ============================================================ */
function tickClock() {
    document.getElementById('clock').textContent = formatClock(Date.now());
}
setInterval(tickClock, 250);
tickClock();

/* ============================================================
   СТАРТ
   ============================================================ */
modal.init();
loadState();
render();
</script>
</body>
</html>
